name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux
            arch: aarch64
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            platform: linux
            arch: armv7
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: darwin
            arch: arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            platform: darwin
            arch: x86_64

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu,armv7-unknown-linux-gnueabihf,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Install cross linkers (Linux ARM)
        if: matrix.os == 'ubuntu-latest' && matrix.target != 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # ponytail: tarball with bare `ender` at root, named for mise github: backend
      # upgrade if mise ever wants dir-prefixed archives (ender-<v>/ender)
      - name: Package
        id: package
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME#v}
          if [[ "$GITHUB_REF_NAME" != v* ]]; then VERSION=dev; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          tar -C target/${{ matrix.target }}/release -czf dist/ender-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz ender

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ender-${{ matrix.target }}
          path: dist/ender-${{ steps.package.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ender-*.tar.gz
          generate_release_notes: true
